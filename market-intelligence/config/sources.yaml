# Source registry. Descriptive metadata only — there are NO credibility weights here.
# allow_external_llm: may this source's text be sent to an external AI provider (Claude)?
#   Only public/official content, or content whose licence permits it, may be true.
# enabled: false until the endpoint has been verified with scripts/check_sources.py.
sources:
  - key: fed_press_releases
    connector: fed_rss
    name: Federal Reserve Board — Press Releases
    source_type: CENTRAL_BANK
    country: US
    base_url: https://www.federalreserve.gov/feeds/press_all.xml
    access_method: RSS
    licence_note: U.S. federal government work (public domain). RSS title/description only. Verified live 2026-09-24.
    allow_external_llm: true
    enabled: true

  - key: bls_cpi
    connector: bls_cpi
    name: U.S. Bureau of Labor Statistics — CPI-U (NSA)
    source_type: STATISTICAL_AUTHORITY
    country: US
    base_url: https://api.bls.gov/publicAPI/v2/timeseries/data/
    access_method: REST_API
    licence_note: Public domain. v2 requires free registration key (BLS_API_KEY); v1 used otherwise. Verified live 2026-09-24.
    allow_external_llm: true
    enabled: true
    options:
      series: [CUUR0000SA0, CUUR0000SA0L1E]

  - key: sec_edgar
    connector: sec_edgar
    name: U.S. SEC EDGAR — Filings (watchlist)
    source_type: REGULATORY
    country: US
    base_url: https://data.sec.gov/submissions/
    access_method: REST_API
    licence_note: Public filings. Fair access requires a User-Agent with contact e-mail (HTTP_USER_AGENT) and <=10 req/s. Metadata and 8-K item codes only, no filing text.
    allow_external_llm: true
    enabled: false   # enable after HTTP_USER_AGENT has a contact e-mail and check_sources passes
    options:
      forms: ["8-K", "10-Q", "10-K"]
      lookback_days: 30
      acceptance_timezone: America/New_York
      watchlist:   # CIKs from EDGAR company search; entities in config/entities.yaml
        - {cik: 320193, ticker: AAPL}
        - {cik: 789019, ticker: MSFT}
        - {cik: 1045810, ticker: NVDA}
        - {cik: 19617, ticker: JPM}
        - {cik: 34088, ticker: XOM}

  - key: ecb_press
    connector: rss
    name: European Central Bank — Press Releases
    source_type: CENTRAL_BANK
    country: EA
    base_url: https://www.ecb.europa.eu/rss/press.html
    access_method: RSS
    licence_note: ECB website content; reuse terms (attribution) to confirm on the ECB copyright page. RSS title/summary only. NOT YET VERIFIED.
    allow_external_llm: true
    enabled: false   # unverified endpoint: run scripts/check_sources.py --include-disabled first
    options:
      url: https://www.ecb.europa.eu/rss/press.html

  - key: youtube_official
    connector: youtube_channels
    name: YouTube — Official channels (whitelist)
    source_type: VIDEO
    country: null
    base_url: https://www.youtube.com/feeds/videos.xml
    access_method: RSS
    licence_note: Public channel feed, metadata only (title, description, upload time). No transcripts.
    allow_external_llm: false   # set true per decision once the whitelist is approved
    enabled: false   # add approved official channel IDs below first
    options:
      channels: []
      # - {channel_id: UCxxxxxxxxxxxxxxxxxxxxxx, name: "<official channel name>", language: en}
