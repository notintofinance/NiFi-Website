# Transparent, deterministic event typing. Evaluation order:
#   1. structured series -> release group -> event type
#   2. the publisher's own category (source_categories)
#   3. keyword_rules, first match wins (case-insensitive, word boundaries)
#   4. otherwise OTHER
release_groups:
  US_CPI: {event_type: INFLATION, title: US CPI release, country: US, asset_classes: [US_RATES, USD, US_EQUITY]}

source_categories:
  fed_press_releases:
    Monetary Policy: MONETARY_POLICY
    Enforcement Actions: REGULATION
    Banking and Consumer Regulatory Policy: REGULATION

keyword_rules:
  - {event_type: MONETARY_POLICY, any: [federal funds rate, policy rate, BI-Rate, FOMC, monetary policy, rate cut, rate hike]}
  - {event_type: INFLATION, any: [consumer price index, CPI, inflation rate, PCE price index]}
  - {event_type: EMPLOYMENT, any: [nonfarm payrolls, unemployment rate, jobless claims]}
  - {event_type: GDP, any: [gross domestic product, GDP]}
  - {event_type: EARNINGS, any: [net profit, net income, quarterly results, earnings per share]}
  - {event_type: DIVIDEND, any: [dividend]}
  - {event_type: BUYBACK, any: [share buyback, repurchase program]}
  - {event_type: CREDIT_RATING, any: [rating downgrade, rating upgrade, outlook to negative, outlook to positive]}
  - {event_type: BOND_AUCTION, any: [auction of government securities, SBN auction, Treasury auction]}
  - {event_type: REGULATION, any: [enforcement action, regulation, stress test, capital requirement]}

# Layering heuristic V1 (to be validated against gold labels): within official /
# company releases, a sentence containing one of these cues is issuer commentary
# (MANAGEMENT layer); otherwise it is FACTUAL. Media documents are always MEDIA.
commentary_cues: [judges, expects, anticipates, believes, sees, noted, outlook, remains committed,
                  will continue, intends, projects, views, is prepared to, risks to]
